<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Distributed load on a beam</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 12px 16px;
  font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
  font-size: 16px;
  line-height: 1.4;
  color: #111827;
  background: #ffffff;
}
h1 { margin: 0 0 8px; font-size: 22px; font-weight: 600; }

</style>
</head>
<body>
<h1>Distributed load on a beam</h1>
<p id="from-link" hidden></p>
<svg id="fig" viewBox="0 0 960 560" role="img" aria-label="A 4 metre beam fixed to a wall at A, with a distributed load on the half AB"></svg>
<section id="controls"></section>
<section id="calc" aria-live="polite"></section>
<script>
(function () {
"use strict";
// ===== svg.js =====
const NS = 'http://www.w3.org/2000/svg';

// One palette for the whole app. It lives here rather than in each renderer
// because build.js concatenates every module into a single scope, so a
// top-level `const C1` in three files would collide and fail the build.
const COLORS = {
  rect:    '#2b6cb0',   // the rectangular load and its equivalent force
  tri:     '#c05621',   // the triangular load and its equivalent force
  comb:    '#2f855a',   // the combined equivalent force
  ink:     '#111827',   // text and outlines
  beam:    '#8a94a6',   // the beam
  wall:    '#cbd5e0',   // the wall and its hatching
  outline: '#4a5568'    // beam outline
};

function el(name, attrs = {}, parent = null) {
  const node = document.createElementNS(NS, name);
  for (const k in attrs) {
    const v = attrs[k];
    if (v !== null && v !== undefined) node.setAttribute(k, String(v));
  }
  if (parent) parent.appendChild(node);
  return node;
}

function clear(node) {
  while (node.firstChild) node.removeChild(node.firstChild);
}

// Text with a background-coloured halo so labels stay readable where they cross lines.
function text(parent, x, y, str, opts = {}) {
  const node = el('text', {
    x, y,
    'font-size': opts.size || 14,
    'font-family': 'system-ui, -apple-system, sans-serif',
    'font-style': opts.italic ? 'italic' : null,
    fill: opts.fill || COLORS.ink,
    'text-anchor': opts.anchor || 'start',
    'font-weight': opts.weight || 400,
    'paint-order': 'stroke',
    stroke: '#ffffff',
    'stroke-width': opts.halo === false ? 0 : 3.5,
    'stroke-linejoin': 'round'
  }, parent);
  node.textContent = str;
  return node;
}

// ===== app.js =====
document.title = 'Distributed load on a beam';

})();
</script>
</body>
</html>
